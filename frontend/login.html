<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NutriFuel | Sign in</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand"><span class="brand-mark">N</span><div><strong>NutriFuel</strong><small>Bar intelligence</small></div></div>
    <h1>Sign in</h1>
    <p class="muted">Sign in as admin or one of the six demo customers.</p>
    <form id="login-form">
      <label>Username<input id="username" required autocomplete="username" placeholder="admin or user1"></label>
      <label>Password<input id="password" type="password" required autocomplete="current-password"></label>
      <button type="submit">Sign in</button>
      <p id="login-error" class="login-error"></p>
    </form>
  </main>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      let response;
      try {
        response = await fetch("/api/demo-login", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({username: document.getElementById("username").value, password: document.getElementById("password").value})});
      } catch (error) {
        document.getElementById("login-error").textContent = "Cannot connect to the server. Restart python server.py.";
        return;
      }
      const data = await response.json().catch(() => ({}));
      if (!response.ok) { document.getElementById("login-error").textContent = data.error || `Sign in failed (HTTP ${response.status}).`; return; }
      window.location.href = data.role === "admin" ? "/admin" : "/";
    });
  </script>
</body>
</html>
